name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_DEDUP_SIMILARITY: ${{ vars.IMAGE_DEDUP_SIMILARITY || '0.92' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: IMAGE_DEDUP_SIMILARITY
          script: |
            set -e

            DEPLOY_DIR="$HOME/TG_Posting_Automatisation"
            CONTAINER_FILTER="posting_bot"

            echo "=== Обновляем код ==="
            cd "$DEPLOY_DIR"
            git pull origin main

            echo "=== Настраиваем порог SSIM из GitHub Actions variable ==="
            python3 - <<'PY'
            import math
            import os
            import re
            from pathlib import Path

            threshold = float(os.environ['IMAGE_DEDUP_SIMILARITY'])
            if not math.isfinite(threshold) or not 0 < threshold <= 1:
                raise SystemExit('IMAGE_DEDUP_SIMILARITY must be a number in (0, 1]')
            env_path = Path('.env')
            lines = env_path.read_text().splitlines(keepends=True)
            pattern = re.compile(r'^\s*(?:export\s+)?IMAGE_DEDUP_SIMILARITY\s*=')
            lines = [line for line in lines if not pattern.match(line)]
            if lines and not lines[-1].endswith('\n'):
                lines[-1] += '\n'
            lines.append(f'IMAGE_DEDUP_SIMILARITY={threshold:g}\n')
            env_path.write_text(''.join(lines))
            print(f'IMAGE_DEDUP_SIMILARITY={threshold:g}')
            PY

            echo "=== Останавливаем старые контейнеры ==="
            CONTAINER_IDS=$(sudo docker ps -a --filter name=$CONTAINER_FILTER --format "{{.ID}}" || true)
            if [ -n "$CONTAINER_IDS" ]; then
              for CID in $CONTAINER_IDS; do
                sudo docker update --restart=no "$CID" 2>/dev/null || true
                CID_PID=$(sudo docker inspect "$CID" --format '{{.State.Pid}}' 2>/dev/null || echo "")
                if [ -n "$CID_PID" ] && [ "$CID_PID" != "0" ]; then
                  sudo kill -9 "$CID_PID" 2>/dev/null || true
                  sleep 1
                fi
                sudo docker rm -f "$CID" 2>/dev/null || true
              done
              sleep 2
            fi
            echo "✅ Старые контейнеры удалены"

            echo "=== Собираем и запускаем контейнер ==="
            sudo docker compose up --build -d

            echo "=== Проверяем запуск ==="
            sleep 6
            if sudo docker ps --filter name=$CONTAINER_FILTER --filter status=running | grep -q .; then
              echo "✅ Бот запущен"
              sudo docker ps --filter name=$CONTAINER_FILTER
              sudo docker logs $(sudo docker ps --filter name=$CONTAINER_FILTER --format "{{.ID}}") --tail=20
            else
              echo "❌ Контейнер не запустился!"
              sudo docker logs $(sudo docker ps -a --filter name=$CONTAINER_FILTER --format "{{.ID}}") --tail=50 2>&1 || true
              exit 1
            fi
