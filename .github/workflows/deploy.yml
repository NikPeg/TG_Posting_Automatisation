name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e

            DEPLOY_DIR="$HOME/TG_Posting_Automatisation"
            CONTAINER_FILTER="posting_bot"

            echo "=== Обновляем код ==="
            cd "$DEPLOY_DIR"
            git pull origin main

            echo "=== Останавливаем старые контейнеры ==="
            CONTAINER_IDS=$(sudo docker ps -a --filter name=$CONTAINER_FILTER --format "{{.ID}}" || true)
            if [ -n "$CONTAINER_IDS" ]; then
              for CID in $CONTAINER_IDS; do
                sudo docker update --restart=no "$CID" 2>/dev/null || true
                CID_PID=$(sudo docker inspect "$CID" --format '{{.State.Pid}}' 2>/dev/null || echo "")
                if [ -n "$CID_PID" ] && [ "$CID_PID" != "0" ]; then
                  sudo kill -9 "$CID_PID" 2>/dev/null || true
                  sleep 1
                fi
                sudo docker rm -f "$CID" 2>/dev/null || true
              done
              sleep 2
            fi
            echo "✅ Старые контейнеры удалены"

            echo "=== Собираем и запускаем контейнер ==="
            sudo docker compose up --build -d

            echo "=== Проверяем запуск ==="
            sleep 6
            if sudo docker ps --filter name=$CONTAINER_FILTER --filter status=running | grep -q .; then
              echo "✅ Бот запущен"
              sudo docker ps --filter name=$CONTAINER_FILTER
              sudo docker logs $(sudo docker ps --filter name=$CONTAINER_FILTER --format "{{.ID}}") --tail=20
            else
              echo "❌ Контейнер не запустился!"
              sudo docker logs $(sudo docker ps -a --filter name=$CONTAINER_FILTER --format "{{.ID}}") --tail=50 2>&1 || true
              exit 1
            fi
